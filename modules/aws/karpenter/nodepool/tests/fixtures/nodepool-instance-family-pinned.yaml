# Characterization fixture A: a NodePool pinning a machine family.
# Server-assigned metadata and status are stripped, and identifiers are placeholders.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default-al2023
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 0s
    consolidationPolicy: WhenEmptyOrUnderutilized
  limits:
    cpu: 1k
  template:
    metadata:
      labels:
        chalk.ai/managed-by: chalk
        chalk.ai/resource-group: default
    spec:
      expireAfter: 720h0m0s
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: al2023
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - c7a
        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values:
            - nitro
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
  weight: 12
